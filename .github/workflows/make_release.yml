name: Release prebuilt glslang

on:
  workflow_dispatch:
    inputs:
      glslang_version:
        description: 'The version of glslang to release'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  glslang-prebuilt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: ./repo
      - name: Run make_release.sh
        run: ./repo/make_release.sh ${{ inputs.glslang_version }}
      - name: Commit and tag release
        working-directory: ./repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glslang/release_info.bzl glslang/LICENSE.txt
          git diff --cached --quiet || git commit -m "Release glslang ${{ inputs.glslang_version }}"
          git tag -a v${{ inputs.glslang_version }} -m "glslang ${{ inputs.glslang_version }}"
          git push origin main --tags
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ inputs.glslang_version }} \
            --repo ${{ github.repository }} \
            --title "glslang ${{ inputs.glslang_version }}" \
            $WINDOWS_ARTIFACT_NAME.tar.xz \
            $LINUX_ARTIFACT_NAME.tar.xz
      - name: Trigger test workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run test.yml \
            --repo ${{ github.repository }} \
            --ref main
